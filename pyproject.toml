[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-booking-watch"
version = "0.2.0"
description = "Validated movie booking-opening alerts with durable cross-provider deduplication"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["ruff==0.14.14"]

[project.scripts]
movie-watch = "movie_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["movie_monitor*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.format]
line-ending = "lf"

